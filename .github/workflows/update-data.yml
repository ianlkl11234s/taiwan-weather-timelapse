name: Update Weather Data

on:
  schedule:
    # Run daily at 06:00 UTC (14:00 Taiwan Time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to include (default: 9)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Default rolling window (kept small to control client download size).
  DEFAULT_DAYS: '9'

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # temperature uses only the stdlib; humidity/pressure need scipy/numpy
        # for interpolation. All three read gis-platform via urllib (no boto3).
        run: |
          pip install scipy numpy

      - name: Resolve days argument
        id: days
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS="${DEFAULT_DAYS}"; fi
          echo "value=$DAYS" >> $GITHUB_OUTPUT

      - name: Update temperature data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/update_data.py --days ${{ steps.days.outputs.value }}

      - name: Update humidity data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/update_humidity.py --days ${{ steps.days.outputs.value }}

      - name: Update pressure data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/update_pressure.py --days ${{ steps.days.outputs.value }}

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet public/temperature_timelapse_data.json public/humidity_timelapse_data.json public/pressure_timelapse_data.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/temperature_timelapse_data.json public/humidity_timelapse_data.json public/pressure_timelapse_data.json
          git commit -m "chore: update weather data $(date +'%Y-%m-%d')"
          git push
